function pageCategory(){
  const{year:y,month:m,dept}=S.cat;
  const sales=Store.getSales(y,m);
  const salesLY=Store.getSales(y-1,m);
  const damage=Store.getDamage(y,m);
  const adepts=[...new Set(sales.map(r=>r.department_code))].sort();
  const filtered=dept==='all'?sales:sales.filter(r=>r.department_code===dept);
  const filteredLY=dept==='all'?salesLY:salesLY.filter(r=>r.department_code===dept);
  const filteredDmg=dept==='all'?damage:damage.filter(r=>r.department_code===dept);

  // Group by category
  const catMap={};
  filtered.forEach(r=>{
    const cat=r.category||'Uncategorized';
    if(!catMap[cat])catMap[cat]={cat,ty:0,qty:0,skus:new Set(),dmg:0};
    catMap[cat].ty+=Number(r.sales||0);
    catMap[cat].qty+=Number(r.qty||0);
    catMap[cat].skus.add(r.sku);
  });
  filteredLY.forEach(r=>{
    const cat=r.category||'Uncategorized';
    if(!catMap[cat])catMap[cat]={cat,ty:0,qty:0,skus:new Set(),dmg:0};
    if(!catMap[cat].ly)catMap[cat].ly=0;
    catMap[cat].ly+=Number(r.sales||0);
  });
  filteredDmg.forEach(r=>{
    const cat=r.category||'Uncategorized';
    if(catMap[cat])catMap[cat].dmg+=Number(r.total_cost||0);
  });

  const cats=Object.values(catMap).map(c=>({...c,skus:c.skus.size,ly:c.ly||0,g:growth(c.ty,c.ly||0)}))
    .sort((a,b)=>b.ty-a.ty);
  const totTY=cats.reduce((a,c)=>a+c.ty,0);

  return`
    <div class="ptitle">Category Analysis</div>
    <div class="pdesc">Analisa sales per kategori produk — ${MONTHS[m-1]} ${y} vs ${y-1}</div>
    ${periodBar(y,m,'cat')}
    <div class="toolbar">
      <select class="sel" data-cat-dept>
        <option value="all">All Departments</option>
        ${adepts.map(c=>`<option value="${c}"${c===dept?' selected':''}>${c} — ${DEPTS[c]||c}</option>`).join('')}
      </select>
    </div>
    ${!cats.length?`<div class="empty"><div class="etitle">Tidak ada data</div></div>`:`
    <div class="panel" style="margin-bottom:16px">
      <div class="ph"><div class="ptl">Sales per Category — ${MONTHS[m-1]} ${y}</div><span class="badge bb">${cats.length} kategori</span></div>
      <div class="twrap"><table class="tbl">
        <thead><tr>
          <th>#</th><th>Category</th>
          <th style="text-align:right">TY Sales</th>
          <th style="text-align:right">% of Total</th>
          <th style="text-align:right">LY Sales</th>
          <th style="text-align:right">Growth</th>
          <th style="text-align:right">Qty</th>

// ---- BUDGET VS ACTUAL ----
function pageBudget(){
  const{year:y,month:m}=S.budg;
  const sales=Store.getSales(y,m);
  const budgets=Store.getBudget(y,m);
  const budgMap=budgets.reduce((a,b)=>{a[b.department_code]=Number(b.budget_amount||0);return a;},{});

  const rows=DCODES.map(code=>{
    const ty=sales.filter(r=>r.department_code===code).reduce((a,r)=>a+Number(r.sales||0),0);
    const budg=budgMap[code]||0;
    const gap=ty-budg;
    const ach=budg>0?((ty/budg)*100):null;
    return{code,name:DEPTS[code],ty,budg,gap,ach};
  }).filter(r=>r.ty>0||r.budg>0).sort((a,b)=>b.budg-a.budg);

  const totTY=rows.reduce((a,r)=>a+r.ty,0);
  const totBudg=rows.reduce((a,r)=>a+r.budg,0);
  const totGap=totTY-totBudg;
  const totAch=totBudg>0?((totTY/totBudg)*100):null;

  const hasBudget=budgets.length>0;

  return`
    <div class="ptitle">Budget vs Actual</div>
    <div class="pdesc">Perbandingan realisasi sales vs budget per department — ${MONTHS[m-1]} ${y}</div>
    ${periodBar(y,m,'budg')}
    ${!hasBudget?`<div class="alert-i">ℹ Belum ada data budget untuk periode ini. Upload budget di halaman Data Upload → tab Budget.</div>`:''}
    <div class="kgrid" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px">
      <div class="kcard"><div class="klbl">Total Budget</div><div class="kval">${fRp(totBudg)}</div><div class="ksub">${totBudg?fRpFull(totBudg):'Belum ada budget'}</div></div>
      <div class="kcard"><div class="klbl">Total Actual (TY)</div><div class="kval">${fRp(totTY)}</div></div>
      <div class="kcard"><div class="klbl">Achievement</div><div class="kval ${totAch>=100?'gpos':totAch>=80?'':' gneg'}">${totAch!==null?totAch.toFixed(1)+'%':'—'}</div></div>
      <div class="kcard"><div class="klbl">Gap vs Budget</div><div class="kval ${totGap>=0?'gpos':'gneg'}">${totGap>=0?'+':''}${fRp(totGap)}</div></div>
    </div>
    <div class="panel">
      <div class="ph"><div class="ptl">Budget vs Actual per Department</div><span class="badge ${totAch>=100?'bg':totAch>=80?'by':'br'}">${totAch!==null?totAch.toFixed(1)+'% achievement':'No budget'}</span></div>
      ${!rows.length?`<div class="empty"><div class="etitle">Tidak ada data</div></div>`:`
      <div class="twrap"><table class="tbl">
        <thead><tr>
          <th>Code</th><th>Department</th>
          <th style="text-align:right">Budget</th>
          <th style="text-align:right">Actual (TY)</th>
          <th style="text-align:right">Gap</th>
          <th style="text-align:right">Achievement</th>
          <th style="text-align:right">Progress</th>
        </tr></thead>
        <tbody>${rows.map(r=>{
          const achPct=r.ach!==null?Math.min(r.ach,150):0;
          const achColor=r.ach>=100?'var(--green)':r.ach>=80?'var(--amber)':'var(--red)';
          return`<tr>
            <td class="mono">${r.code}</td>
            <td style="font-weight:600">${esc(r.name)}</td>
            <td class="num" style="color:var(--tm)">${r.budg?fRp(r.budg):'—'}</td>
            <td class="num">${fRp(r.ty)}</td>
            <td class="num ${r.gap>=0?'gpos':'gneg'}">${r.gap>=0?'+':''}${fRp(r.gap)}</td>
            <td class="num" style="font-weight:700;color:${r.ach>=100?'var(--green)':r.ach>=80?'var(--amber)':'var(--red)'}">${r.ach!==null?r.ach.toFixed(1)+'%':r.budg?'0%':'—'}</td>
            <td style="min-width:100px;padding:10px 14px">
              <div style="background:var(--bg3);border-radius:4px;height:8px;overflow:hidden">
                <div style="width:${Math.min(achPct,100)}%;height:100%;background:${achColor};border-radius:4px;transition:width .4s"></div>
              </div>
            </td>
          </tr>`;
        }).join('')}</tbody>
        <tfoot><tr style="font-weight:800;background:var(--bg3)">
          <td colspan="2" style="padding:10px 14px;font-size:12px">TOTAL STORE</td>
          <td class="num" style="font-weight:700">${fRp(totBudg)}</td>
          <td class="num" style="font-weight:700">${fRp(totTY)}</td>
          <td class="num ${totGap>=0?'gpos':'gneg'}" style="font-weight:700">${totGap>=0?'+':''}${fRp(totGap)}</td>
          <td class="num" style="font-weight:800;color:${totAch>=100?'var(--green)':totAch>=80?'var(--amber)':'var(--red)'}">${totAch!==null?totAch.toFixed(1)+'%':'—'}</td>
          <td></td>
        </tr></tfoot>
      </table></div>`}
    </div>
    ${rows.length>0?`
    <div class="panel" style="margin-top:16px">
      <div class="ph"><div class="ptl">Budget vs Actual — Visualisasi</div><span style="font-size:11px;color:var(--tm)">${MONTHS[m-1]} ${y}</span></div>
      ${groupedBarChart(rows.filter(r=>r.budg>0||r.ty>0).map(r=>({
        lbl:r.code,
        budget:r.budg,
        actual:r.ty,
      })))}
    </div>`:''}`;
}

function pageUpload(){
  const{tab,step,year:y,month:m,prev,res}=S.upload;
  const yrs=[2025,2026,2027,2028,2029,2030];
  const tabs=[{id:'sales',l:'Sales'},{id:'budget',l:'Budget'},{id:'damage',l:'Damage'}];
  function ws(n,lbl){
    const done=step>n,cur=step===n;
    return`<div class="ws${done?' done':cur?' cur':''}"><div class="wsn">${done?'✓':n}</div><span class="wslbl">${lbl}</span></div>`;
  }
  const fmts={
    sales:`<div style="font-family:monospace;font-size:11px;color:var(--tm);line-height:1.8">
      <div style="color:var(--blue);font-weight:600">DEPARTEMEN | SKU | DESCRIPTION | QTY | SALES | CATEGORY</div>
      <div>96 | 9600001 | RED APPLE 1KG | 100 | 5000000 | FRUIT</div>
    </div>`,
    budget:`<div style="font-family:monospace;font-size:11px;color:var(--tm);line-height:1.8">
      <div style="color:var(--blue);font-weight:600">DEPARTEMEN | BUDGET</div>
      <div>96 | 50000000</div>
    </div>`,
    damage:`<div style="font-family:monospace;font-size:11px;color:var(--tm);line-height:1.8">
      <div style="color:var(--blue);font-weight:600">DEPARTEMEN | SKU | DESCRIPTION | QTY | TOTAL COST | CATEGORY</div>
      <div>96 | 9600001 | RED APPLE 1KG | 5 | 250000 | FRUIT</div>
    </div>`
  };
  return`
    <div class="ptitle">Data Upload</div>
    <div class="pdesc">Upload Sales, Budget, or Damage data from Excel</div>
    <div class="utabs">${tabs.map(t=>`<div class="utab${tab===t.id?' on':''}" data-utab="${t.id}">${t.l}</div>`).join('')}</div>
    <div class="panel">
      <div style="padding:20px">
        <div class="wsteps">
          ${ws(1,'Period & File')}<div class="wcon${step>1?' done':''}"></div>
          ${ws(2,'Validating')}<div class="wcon${step>2?' done':''}"></div>
          ${ws(3,'Preview')}<div class="wcon${step>3?' done':''}"></div>
          ${ws(4,'Confirm')}<div class="wcon${step>4?' done':''}"></div>
          ${ws(5,'Result')}
        </div>
        ${step===1?`
          <div class="frow" style="margin-bottom:20px">
            <div class="fg"><label class="fl">Year</label>
              <select class="inp" id="upYear">${yrs.map(yr=>`<option value="${yr}"${yr===y?' selected':''}>${yr}</option>`).join('')}</select>
            </div>
            <div class="fg"><label class="fl">Month</label>
              <select class="inp" id="upMonth">${MONTHS.map((mn,i)=>`<option value="${i+1}"${i+1===m?' selected':''}>${mn}</option>`).join('')}</select>
            </div>
          </div>
          <div class="alert-i" style="margin-bottom:16px">ℹ Uploading <strong>${tab.toUpperCase()}</strong> for <strong>${pl(y,m)}</strong> — existing data will be REPLACED after confirmation.</div>
          <div style="background:var(--bg3);border:1px solid var(--bd);border-radius:4px;padding:12px 16px;margin-bottom:16px">
            <div style="font-size:11px;font-weight:600;color:var(--t2);margin-bottom:8px;text-transform:uppercase">Required Format — ${tab.toUpperCase()}</div>
            ${fmts[tab]}
          </div>
          <div class="dropz" id="dropZone">
            <div style="font-size:32px;margin-bottom:10px">📊</div>
            <div style="font-size:14px;font-weight:500;margin-bottom:6px">Drop Excel file here or click to browse</div>
            <div style="font-size:12px;color:var(--tm)">Accepted: .xlsx, .xls</div>
          </div>
        `:''}
        ${step===2?`<div style="padding:32px;text-align:center"><div class="spin" style="width:32px;height:32px;margin:0 auto 16px"></div><div>Validating file…</div></div>`:''}
        ${step===3&&prev?`
          <div class="srow"><span class="sl">File</span><span class="sv mono" style="font-size:11px">${esc(prev.filename||'—')}</span></div>
          <div class="srow"><span class="sl">Original rows</span><span class="sv">${prev.originalCount||0}</span></div>
          <div class="srow"><span class="sl">Records after aggregation</span><span class="sv">${prev.rows.length}</span></div>
          <div class="srow"><span class="sl">Duplicates merged</span><span class="sv">${(prev.originalCount||0)-prev.rows.length}</span></div>
          <div class="srow"><span class="sl">Warnings</span><span class="sv ${prev.warnings.length?'gneg':''}">${prev.warnings.length}</span></div>
          <div class="srow" style="margin-bottom:16px"><span class="sl">Errors</span><span class="sv ${prev.errors.length?'gneg':''}">${prev.errors.length}</span></div>
          ${prev.errors.length?`<div class="elist">${prev.errors.map(e=>`<div class="ei">✕ ${esc(e)}</div>`).join('')}</div>`:''}
          ${prev.warnings.length?`<div class="wlist">${prev.warnings.slice(0,10).map(w=>`<div class="wi">⚠ ${esc(w)}</div>`).join('')}${prev.warnings.length>10?`<div class="wi">…and ${prev.warnings.length-10} more</div>`:''}</div>`:''}
          ${prev.errors.length===0?`<div style="display:flex;gap:10px;margin-top:16px">
            <button class="btn btn-s" id="upCancel">Cancel</button>
            <button class="btn btn-p" id="upProceed">Proceed to Confirm →</button>
          </div>`:`<button class="btn btn-s" style="margin-top:12px" id="upCancel">← Fix and Re-upload</button>`}
        `:''}
        ${step===4?`
          <div class="alert-i" style="margin-bottom:16px">⚠ This will <strong>REPLACE</strong> all ${tab} data for <strong>${pl(y,m)}</strong> with ${prev?.rows.length} records.</div>
          <div style="display:flex;gap:10px">
            <button class="btn btn-s" id="upBack">← Back</button>
            <button class="btn btn-p" id="upConfirm">Confirm — Replace ${pl(y,m)} ${tab.charAt(0).toUpperCase()+tab.slice(1)}</button>
          </div>
        `:''}
        ${step===5&&res?`
          ${res.success
            ?`<div class="sbox"><div style="font-size:32px;margin-bottom:10px">✓</div><div style="font-size:16px;font-weight:600;color:var(--green)">Import Successful</div><div style="font-size:13px;color:var(--t2);margin-top:6px">${res.rows} records imported for ${pl(y,m)}</div></div>`
            :`<div class="elist"><div class="ei">✕ Import failed: ${esc(res.msg)}</div><div style="color:var(--t2);font-size:12px;margin-top:6px;padding:0 8px">Previous data is safe and unchanged.</div></div>`
          }
          <button class="btn btn-s" style="margin-top:16px" id="upReset">Upload Another File</button>
        `:''}
      </div>
    </div>`;
}

function pageDepartments(){
  const{year:y,month:m}=S.dept;
  const sales=Store.getSales(y,m),budgets=Store.getBudget(y,m),damage=Store.getDamage(y,m);
  return`
    <div class="ptitle">Master Department</div>
    <div class="pdesc">Department reference codes and activity</div>
    ${periodBar(y,m,'dept')}
    <div class="panel">
      <div class="ph"><div class="ptl">Department Master</div><span class="badge bb">${DCODES.length} departments</span></div>
      <div class="twrap"><table class="tbl">
        <thead><tr><th>Code</th><th>Department Name</th><th style="text-align:right">SKUs</th><th style="text-align:right">Budget</th><th>Damage</th><th>Status</th></tr></thead>
        <tbody>${DCODES.map(code=>{
          const skuCnt=[...new Set(sales.filter(r=>r.department_code===code).map(r=>r.sku))].length;
          const bd=budgets.find(b=>b.department_code===code);
          const dmgCnt=damage.filter(r=>r.department_code===code).length;
          return`<tr>
            <td class="mono">${code}</td>
            <td>${esc(DEPTS[code])}</td>
            <td class="num">${skuCnt||'—'}</td>
            <td class="num">${bd?fRp(bd.budget_amount):'—'}</td>
            <td>${dmgCnt?`<span class="badge by">${dmgCnt} items</span>`:'—'}</td>
            <td><span class="badge bg">Active</span></td>
          </tr>`;}).join('')}
        </tbody>
      </table></div>
    </div>`;
}

function pageSettings(){
  const{tab,pass,pmsg,nu,umsg,conf}=S.settings;
  const u=S.user;
  const users=Store.getUsers();
  const totalS=DCODES.reduce((a,c)=>{for(let y=2023;y<=2027;y++)for(let m=1;m<=12;m++)a+=Store.getSales(y,m).filter(r=>r.department_code===c).length;return a;},0);
  return`
    <div class="ptitle">Settings & User</div>
    <div class="pdesc">Account management and system information</div>
    <div class="utabs">${[['account','My Account'],['users','User Management'],['system','System & Data']].map(([t,l])=>`<div class="utab${tab===t?' on':''}" data-stab="${t}">${l}</div>`).join('')}</div>
    ${tab==='account'?`<div class="panel" style="max-width:480px">
      <div class="ph"><div class="ptl">My Account</div></div>
      <div style="padding:20px">
        <div style="display:flex;align-items:center;gap:14px;margin-bottom:20px">
          <div class="uav" style="width:48px;height:48px;font-size:18px">${(u?.name||'U')[0]}</div>
          <div>
            <div style="font-weight:600;font-size:15px">${esc(u?.name||'—')}</div>
            <div style="font-size:12px;color:var(--tm)">${esc(u?.email||'')}</div>
            <span class="badge bb" style="margin-top:4px;display:inline-block">${u?.role}</span>
          </div>
        </div>
        <hr class="divider"/>
        <div class="fg"><label class="fl">Change Password</label>
          <input class="inp" type="password" placeholder="New password (min 6 chars)" value="${esc(pass)}" id="passInp"/>
        </div>
        ${pmsg?`<div style="font-size:12px;color:${pmsg.includes('berhasil')?'var(--green)':'var(--red)'};margin-bottom:10px">${esc(pmsg)}</div>`:''}
        <button class="btn btn-p btn-sm" id="savePass">Update Password</button>
      </div>
    </div>`:''}
    ${tab==='users'?u?.role==='admin'?`
      <div class="panel" style="margin-bottom:16px">
        <div class="ph"><div class="ptl">Users</div><span class="badge bb">${users.length}</span></div>
        <div class="twrap"><table class="tbl">
          <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Action</th></tr></thead>
          <tbody>${users.map(usr=>`<tr>
            <td><div style="display:flex;align-items:center;gap:8px"><div class="uav" style="width:22px;height:22px;font-size:9px;margin:0">${(usr.name||'?')[0]}</div>${esc(usr.name)}</div></td>
            <td class="mono">${esc(usr.email)}</td>
            <td>${usr.id===u.id?`<span class="badge bb">${usr.role}</span>`:`<select class="sel" style="padding:3px 6px;font-size:11px;min-width:90px" data-role-user="${usr.id}">${['admin','manager','viewer'].map(r=>`<option value="${r}"${r===usr.role?' selected':''}>${r}</option>`).join('')}</select>`}</td>
            <td>${usr.id!==u.id?`<button class="btn btn-sm btn-d" data-del-user="${usr.id}">Remove</button>`:''}</td>
          </tr>`).join('')}</tbody>
        </table></div>
      </div>
      <div class="panel">
        <div class="ph"><div class="ptl">Add New User</div></div>
        <div style="padding:20px">
          <div class="frow">
            <div class="fg"><label class="fl">Name</label><input class="inp" id="nuName" placeholder="Full name" value="${esc(nu.name)}"/></div>
            <div class="fg"><label class="fl">Email</label><input class="inp" type="email" id="nuEmail" placeholder="email@company.com" value="${esc(nu.email)}"/></div>
          </div>
          <div class="frow">
            <div class="fg"><label class="fl">Password</label><input class="inp" type="password" id="nuPass" placeholder="Min 6 chars" value="${esc(nu.password)}"/></div>
            <div class="fg"><label class="fl">Role</label><select class="inp" id="nuRole">${['admin','manager','viewer'].map(r=>`<option value="${r}"${r===nu.role?' selected':''}>${r.charAt(0).toUpperCase()+r.slice(1)}</option>`).join('')}</select></div>
          </div>
          ${umsg?`<div style="font-size:12px;color:${umsg.includes('berhasil')||umsg.includes('ditambahkan')?'var(--green)':'var(--red)'};margin-bottom:10px">${esc(umsg)}</div>`:''}
          <button class="btn btn-p" id="addUser">Add User</button>
        </div>
      </div>`:`<div class="panel"><div class="empty"><div class="etitle">Admin Access Required</div></div></div>`:''}
    ${tab==='system'?`
      <div class="grid2" style="margin-bottom:16px">
        <div class="panel">
          <div class="ph"><div class="ptl">Data Status</div></div>
          <div class="srow"><span class="sl">Sales records (all periods)</span><span class="sv">${totalS.toLocaleString('id')}</span></div>
          <div class="srow"><span class="sl">Storage type</span><span class="sv"><span class="badge bg">Supabase Cloud</span></span></div>
          <div class="srow"><span class="sl">Project</span><span class="sv" style="font-size:10px;font-family:monospace">${SUPA_URL.replace('https://','').split('.')[0]}</span></div>
          <div class="srow"><span class="sl">Status</span><span class="sv"><span class="badge bg">● Online</span></span></div>
          <hr class="divider" style="margin:0 20px"/>
          <div style="padding:16px 20px">
            <div class="fl" style="margin-bottom:8px">Reset Demo Data</div>
            <div style="font-size:12px;color:var(--tm);margin-bottom:10px">Clears all data, regenerates sample data. Accounts preserved.</div>
            <div style="display:flex;gap:8px;align-items:center">
              <input class="inp" style="max-width:120px" placeholder='Type "RESET"' id="confReset" value="${esc(conf)}"/>
              <button class="btn btn-d btn-sm" id="doReset">Reset</button>
            </div>
          </div>
        </div>
        <div class="panel">
          <div class="ph"><div class="ptl">Data Flow</div></div>
          <div class="flow">
            ${['SALES / BUDGET / DAMAGE EXCEL','FILE VALIDATION','DUPLICATE SKU AGGREGATION','PERIOD REPLACEMENT (ATOMIC)','CLOUD DATABASE (SUPABASE)','TY / LY ENGINE','ANALYTICS DASHBOARD'].map((n,i,a)=>`
              <div class="fnode${i===4?' hi':''}">${n}</div>
              ${i<a.length-1?'<div class="farr">↓</div>':''}`).join('')}
          </div>
        </div>
      </div>`:''}
  `;
}

function pageLogin(){
  const err=S.loginErr||'';
  const loading=S.loginLoading||false;
  return`<div class="loginw">
    <div class="loginc">
      <div class="lhead">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
          <div class="smark" style="width:40px;height:40px;font-size:18px;border-radius:10px">H</div>
          <div>
            <div style="font-size:17px;font-weight:800;color:var(--t1)">Hypermart Analytics</div>
            <div style="font-size:11px;color:var(--tm)">Retail Sales & Damage System</div>
          </div>
        </div>
        <div style="font-size:11px;color:var(--tm);background:var(--bg3);padding:8px 12px;border-radius:6px;border:1px solid var(--bd)">
          🏬 Hypermart 284 Ambon City Center — MPPA Retail Group
        </div>
      </div>
      <div class="lbody">
        <div class="fg">
          <label class="fl">Email</label>
          <input class="inp" type="email" id="loginEmail" placeholder="email@perusahaan.com" autocomplete="username"/>
        </div>
        <div class="fg">
          <label class="fl">Password</label>
          <input class="inp" type="password" id="loginPass" placeholder="Password" autocomplete="current-password"/>
        </div>
        ${err?`<div style="color:var(--red);font-size:12px;margin-bottom:12px;background:rgba(220,38,38,.06);padding:8px 12px;border-radius:6px;border:1px solid rgba(220,38,38,.2)">${esc(err)}</div>`:''}
        <button class="btn btn-p" style="width:100%;justify-content:center;font-size:14px;padding:12px" id="loginBtn" ${loading?'disabled':''}>
          ${loading?'<span class="spin"></span> Masuk...':'Masuk'}
        </button>
        <div style="margin-top:24px;padding-top:16px;border-top:1px solid var(--bd);text-align:center">
          <div style="font-size:11px;font-weight:800;color:var(--blue);letter-spacing:.5px;text-transform:uppercase">Design by Armstrong Sabandar</div>
          <div style="font-size:10px;color:var(--tm);margin-top:3px">Hypermart 284 Ambon City Center</div>
        </div>
      </div>
    </div>
  </div>`;
}

// ---- EXCEL PARSER ----
function normK(o){const r={};Object.entries(o).forEach(([k,v])=>{r[k.trim().toUpperCase().replace(/\s+/g,'_')]=v;});return r;}
function parseXlsx(file){
  // Helper: try to repair embedded XLSX, or load from CDN as fallback
  function ensureXLSX(){
    return new Promise((resolve,reject)=>{
      // 1) Embedded library already OK?
      if(typeof window.XLSX!=='undefined' && typeof window.XLSX.read==='function'){
        return resolve(window.XLSX);
      }
      // 2) Try to re-init from make_xlsx_lib (embedded but window.XLSX not set)
      try{
        if(typeof make_xlsx_lib==='function'){
          if(typeof window.XLSX==='undefined' || !window.XLSX.read){
            var xlsxObj={};
            make_xlsx_lib(xlsxObj);
            if(typeof xlsxObj.read==='function'){
              window.XLSX=xlsxObj;
              return resolve(window.XLSX);
            }
          }
        }
      }catch(e){ /* fallthrough ke CDN */ }
      // 3) Lazy-load dari CDN sebagai fallback
      if(document.getElementById('__xlsx_cdn_script')){
        // Script CDN sudah di-inject tapi XLSX belum siap — tunggu sebentar
        var waited=0;
        var poll=setInterval(function(){
          waited+=100;
          if(typeof window.XLSX!=='undefined' && typeof window.XLSX.read==='function'){
            clearInterval(poll);
            resolve(window.XLSX);
          } else if(waited>=8000){
            clearInterval(poll);
            reject(new Error('Library XLSX dari CDN tidak berhasil dimuat. Periksa koneksi internet lalu coba lagi.'));
          }
        },100);
        return;
      }
      // Inject CDN script
      var s=document.createElement('script');
      s.id='__xlsx_cdn_script';
      s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload=function(){
        if(typeof window.XLSX!=='undefined' && typeof window.XLSX.read==='function'){
          resolve(window.XLSX);
        } else {
          reject(new Error('Library XLSX dari CDN tidak berhasil diinisialisasi.'));
        }
      };
      s.onerror=function(){
        reject(new Error('Gagal memuat library XLSX dari CDN. Periksa koneksi internet lalu coba lagi.'));
      };
      document.head.appendChild(s);
    });
  }

  return ensureXLSX().then(function(XLSXLib){
    return new Promise((res,rej)=>{
      const rd=new FileReader();
      rd.onload=e=>{
        try{
          const d=new Uint8Array(e.target.result);
          const wb=XLSXLib.read(d,{type:'array'});
          if(!wb||!wb.SheetNames||!wb.SheetNames.length) throw new Error('File Excel tidak memiliki sheet.');
          const ws=wb.Sheets[wb.SheetNames[0]];
          res(XLSXLib.utils.sheet_to_json(ws,{defval:''}));
        }catch(err){
          rej(new Error('File tidak bisa dibaca. Pastikan format .xlsx atau .xls dan coba lagi. Detail: '+err.message));
        }
      };
      rd.onerror=()=>rej(new Error('Gagal membaca file.'));
      rd.readAsArrayBuffer(file);
    });
  });
}
function validateSales(raw){
  // CATEGORY tidak wajib berisi nilai — baris tetap diproses walau kosong
  // Kolom CATEGORY wajib ADA di header, tapi boleh kosong per baris
  const req=['DEPARTEMEN','SKU','DESCRIPTION','QTY','SALES'];
  const errs=[],warns=[];
  if(!raw.length){errs.push('File kosong.');return{errs,warns,rows:[],originalCount:0};}
  const s=normK(raw[0]);
  const miss=req.filter(k=>!(k in s));
  if(miss.length){errs.push(`Kolom wajib tidak ditemukan: ${miss.join(', ')}`);return{errs,warns,rows:[],originalCount:0};}
  // CATEGORY kolom — kalau tidak ada sama sekali, warning saja, jangan error
  if(!('CATEGORY' in s))warns.push('Kolom CATEGORY tidak ditemukan — category akan dikosongkan.');
  const map={};
  let skipped=0;
  raw.forEach((r,i)=>{
    const n=normK(r);
    const dept=String(n.DEPARTEMEN||'').trim().padStart(2,'0');
    const sku=String(n.SKU||'').trim();
    // Skip hanya jika SKU benar-benar kosong
    if(!sku){skipped++;return;}
    // Dept tidak dikenal = warning saja, BUKAN skip — data tetap masuk
    if(!DEPTS[dept])warns.push(`Row ${i+2}: Dept "${dept}" tidak dikenal — data tetap disimpan.`);
    const qty=parseFloat(String(n.QTY||'0').replace(/,/g,'.'))||0;
    const sales=parseFloat(String(n.SALES||'0').replace(/,/g,'.'))||0;
    const cat=String(n.CATEGORY||'').trim(); // boleh kosong
    const key=`${dept}__${sku}`;
    if(map[key]){
      map[key].qty+=qty;
      map[key].sales+=sales;
      // Kalau category berbeda, simpan keduanya
      if(cat&&map[key].category&&cat!==map[key].category)
        warns.push(`SKU ${sku}: category berbeda ("${map[key].category}" vs "${cat}") — menggunakan yang pertama.`);
    } else {
      map[key]={department_code:dept,sku,description:String(n.DESCRIPTION||'').trim(),qty,sales,category:cat};
    }
  });
  if(skipped>0)warns.push(`${skipped} baris dilewati karena SKU kosong.`);
  return{errs,warns,rows:Object.values(map),originalCount:raw.length};
}
function validateBudget(raw){
  const errs=[],warns=[];
  if(!raw.length){errs.push('File kosong.');return{errs,warns,rows:[]};}
  const s=normK(raw[0]);
  if(!('DEPARTEMEN' in s)||!('BUDGET' in s)){errs.push('Kolom DEPARTEMEN dan BUDGET diperlukan.');return{errs,warns,rows:[]};}
  const rows=[];
  raw.forEach((r,i)=>{const n=normK(r);const dept=String(n.DEPARTEMEN||'').trim().padStart(2,'0');const bud=parseFloat(n.BUDGET)||0;if(!DEPTS[dept])warns.push(`Row ${i+2}: Dept "${dept}" tidak dikenal.`);rows.push({department_code:dept,budget_amount:bud});});
  return{errs,warns,rows,originalCount:raw.length};
}
function validateDamage(raw){
  const errs=[],warns=[];
  if(!raw.length){errs.push('File kosong.');return{errs,warns,rows:[],originalCount:0};}
  const s=normK(raw[0]);
  const hasCost='TOTAL_COST' in s||'TOTAL COST' in s;
  const miss=['DEPARTEMEN','SKU','DESCRIPTION','QTY'].filter(k=>!(k in s));
  if(!hasCost)miss.push('TOTAL COST');
  if(miss.length){errs.push(`Kolom wajib tidak ditemukan: ${miss.join(', ')}`);return{errs,warns,rows:[],originalCount:0};}
  if(!('CATEGORY' in s))warns.push('Kolom CATEGORY tidak ditemukan — category akan dikosongkan.');
  const map={};
  let skipped=0;
  raw.forEach((r,i)=>{
    const n=normK(r);
    const dept=String(n.DEPARTEMEN||'').trim().padStart(2,'0');
    const sku=String(n.SKU||'').trim();
    if(!sku){skipped++;return;}
    if(!DEPTS[dept])warns.push(`Row ${i+2}: Dept "${dept}" tidak dikenal — data tetap disimpan.`);
    const qty=parseFloat(String(n.QTY||'0').replace(/,/g,'.'))||0;
    const cost=parseFloat(String(n.TOTAL_COST||n['TOTAL COST']||'0').replace(/,/g,'.'))||0;
    const cat=String(n.CATEGORY||'').trim();
    const key=`${dept}__${sku}`;
    if(map[key]){map[key].qty+=qty;map[key].total_cost+=cost;}
    else map[key]={department_code:dept,sku,description:String(n.DESCRIPTION||'').trim(),qty,total_cost:cost,category:cat};
  });
  if(skipped>0)warns.push(`${skipped} baris dilewati karena SKU kosong.`);
  return{errs,warns,rows:Object.values(map),originalCount:raw.length};
}

// ---- EXPORT — tampil sebagai modal in-app ----
// Platform artifact memblokir download, jadi data ditampilkan di modal
// User bisa screenshot atau share link artifact untuk akses data

let _exportModal = null;

function exportXLSX(rows, cols, filename){
  // Buat modal in-app
  const title = filename.replace('.xlsx','').replace(/_/g,' ');

  // Build raw data values (unformatted numbers for copy, for accurate paste to Excel)
  const getRaw = (c, r) => {
    const v = typeof c.g==='function' ? c.g(r) : r[c.k];
    return v==null ? '' : String(v);
  };

  const thHtml = cols.map(c=>`<th style="background:var(--bg3);color:var(--tm);padding:7px 10px;text-align:left;white-space:nowrap;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--bd)">${c.l}</th>`).join('');
  const tbHtml = rows.map((r,ri)=>`<tr style="background:${ri%2===0?'var(--bgc)':'var(--bg3)'};">${
    cols.map(c=>{
      const v=typeof c.g==='function'?c.g(r):r[c.k];
      const isNum=c.num&&!isNaN(Number(v))&&v!==''&&v!==null;
      const disp=isNum?Number(v).toLocaleString('id'):String(v??'');
      return`<td style="padding:7px 10px;font-size:11px;white-space:nowrap;border-bottom:1px solid var(--bd2);${isNum?'text-align:right;font-family:monospace':'color:var(--t1)'}">${disp}</td>`;
    }).join('')
  }</tr>`).join('');

  // Build tab-separated text for clipboard (header + rows, raw values)
  const tsvHeader = cols.map(c=>c.l).join('\t');
  const tsvRows = rows.map(r=>cols.map(c=>getRaw(c,r)).join('\t')).join('\n');
  const tsvData = tsvHeader + '\n' + tsvRows;

  // Buat atau update modal
  let modal = document.getElementById('exportModal');
  if(!modal){
    modal = document.createElement('div');
    modal.id = 'exportModal';
    modal.style.cssText = 'position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.7);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto';
    document.body.appendChild(modal);
  }
  modal.innerHTML = `
    <div style="background:var(--bg2);border:1px solid var(--bd);border-radius:6px;width:100%;max-width:900px;margin:auto">
      <div style="padding:14px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg2);z-index:1">
        <div style="min-width:0">
          <div style="font-size:13px;font-weight:600;color:var(--t1)">${title}</div>
          <div style="font-size:11px;color:var(--tm);margin-top:2px">${rows.length.toLocaleString('id')} baris — ${new Date().toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'})}</div>
        </div>
        <div style="display:flex;gap:8px;flex-shrink:0">
          <button id="exportCopyBtn" style="background:var(--green);color:#fff;border:none;padding:7px 13px;border-radius:4px;cursor:pointer;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px">
            📋 Copy ke Excel
          </button>
          <button onclick="document.getElementById('exportModal').remove()" style="background:var(--bg3);border:1px solid var(--bd);color:var(--t2);padding:6px 12px;border-radius:4px;cursor:pointer;font-size:12px">✕ Tutup</button>
        </div>
      </div>
      <div style="padding:12px 16px;background:rgba(59,130,246,.08);border-bottom:1px solid rgba(59,130,246,.2);font-size:12px;color:#93c5fd">
        💡 <strong>Cara cepat:</strong> Klik <b>📋 Copy ke Excel</b> → Buka Google Sheets / Excel → Paste (Ctrl+V). Semua kolom langsung rapi terpisah.
      </div>
      <div id="exportCopyFeedback" style="display:none;padding:8px 16px;background:rgba(5,150,105,.12);border-bottom:1px solid rgba(5,150,105,.3);font-size:12px;color:var(--green);font-weight:600">
        ✅ Berhasil disalin! ${rows.length.toLocaleString('id')} baris siap paste ke Excel/Google Sheets.
      </div>
      <div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
        <table style="width:100%;border-collapse:collapse;min-width:500px">
          <thead><tr>${thHtml}</tr></thead>
          <tbody>${tbHtml}</tbody>
        </table>
      </div>
      <div style="padding:12px 16px;border-top:1px solid var(--bd);font-size:11px;color:var(--tm);text-align:center">
        Total ${rows.length.toLocaleString('id')} baris data
      </div>
    </div>`;
  modal.onclick = e => { if(e.target===modal) modal.remove(); };

  // Wire up copy button
  const copyBtn = document.getElementById('exportCopyBtn');
  if(copyBtn){
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(tsvData).then(()=>{
        const fb = document.getElementById('exportCopyFeedback');
        if(fb){ fb.style.display='block'; setTimeout(()=>{ fb.style.display='none'; }, 3500); }
        copyBtn.textContent = '✅ Tersalin!';
        setTimeout(()=>{ copyBtn.innerHTML = '📋 Copy ke Excel'; }, 2500);
      }).catch(()=>{
        // Fallback for older browsers / mobile
        const ta = document.createElement('textarea');
        ta.value = tsvData;
        ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        try{ document.execCommand('copy');
          const fb = document.getElementById('exportCopyFeedback');
          if(fb){ fb.style.display='block'; setTimeout(()=>{ fb.style.display='none'; }, 3500); }
          copyBtn.textContent = '✅ Tersalin!';
          setTimeout(()=>{ copyBtn.innerHTML = '📋 Copy ke Excel'; }, 2500);
        }catch(e){ alert('Salin manual: tekan Ctrl+A pada tabel lalu Ctrl+C'); }
        document.body.removeChild(ta);
      });
    };
  }
}

      {l:'Dept Code',k:'department_code'},{l:'Department',g:r=>DEPTS[r.department_code]||r.department_code},

      {l:'TY Sales',k:'sales',num:true},{l:'TY Qty',k:'qty',num:true},

      {l:'Growth %',k:'growth_pct'},
      {l:'Damage Cost',k:'damage_cost',num:true},{l:'% Dmg',k:'damage_pct'},
      {l:'Status',k:'status'}
    ], S.sales.view==='missing'
      ? `SKU_Hilang_${MONTHS[m-1]}_${y}.xlsx`
      : `Sales_Analysis_${MONTHS[m-1]}_${y}.xlsx`

async function handleFile(f){
  S.upload.step=2;re();
  try{
    const raw=await parseXlsx(f);
    let v;
    if(S.upload.tab==='sales')v=validateSales(raw);
    else if(S.upload.tab==='budget')v=validateBudget(raw);
    else v=validateDamage(raw);
    S.upload.prev={...v,errors:v.errs,warnings:v.warns||[],filename:f.name};
    S.upload.step=3;
  }catch(err){
    S.upload.prev={errors:[err.message],warnings:[],rows:[],filename:f.name,originalCount:0};
    S.upload.step=3;
  }
  re();
}
