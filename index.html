            ${['SALES / BUDGET / DAMAGE EXCEL','FILE VALIDATION','DUPLICATE SKU AGGREGATION','PERIOD REPLACEMENT (ATOMIC)','CLOUD DATABASE (SUPABASE)','TY / LY ENGINE','ANALYTICS DASHBOARD'].map((n,i,a)=>`
              <div class="fnode${i===4?' hi':''}">${n}</div>
              ${i<a.length-1?'<div class="farr">↓</div>':''}`).join('')}
          </div>
        </div>
      </div>`:''}
  `;

// ---- EXCEL PARSER ----
function normK(o){const r={};Object.entries(o).forEach(([k,v])=>{r[k.trim().toUpperCase().replace(/\s+/g,'_')]=v;});return r;}
function parseXlsx(file){
  // Library XLSX dimuat via CDN di <head>
  function ensureXLSX(){
    return new Promise(function(resolve, reject){
      if(typeof window.XLSX!=='undefined' && typeof window.XLSX.read==='function'){
        return resolve(window.XLSX);
      }
      reject(new Error('Library XLSX belum siap. Pastikan koneksi internet aktif dan muat ulang halaman.'));
    });
  }

  return ensureXLSX().then(function(XLSXLib){
    return new Promise((res,rej)=>{
      const rd=new FileReader();
      rd.onload=e=>{
        try{
          const d=new Uint8Array(e.target.result);
          const wb=XLSXLib.read(d,{type:'array'});
          if(!wb||!wb.SheetNames||!wb.SheetNames.length) throw new Error('File Excel tidak memiliki sheet.');
          const ws=wb.Sheets[wb.SheetNames[0]];
          res(XLSXLib.utils.sheet_to_json(ws,{defval:''}));
        }catch(err){
          rej(new Error('File tidak bisa dibaca. Pastikan format .xlsx atau .xls dan coba lagi. Detail: '+err.message));
        }
      };
      rd.onerror=()=>rej(new Error('Gagal membaca file.'));
      rd.readAsArrayBuffer(file);
    });
  });
}
function validateSales(raw){
  // CATEGORY tidak wajib berisi nilai — baris tetap diproses walau kosong
  // Kolom CATEGORY wajib ADA di header, tapi boleh kosong per baris
  const req=['DEPARTEMEN','SKU','DESCRIPTION','QTY','SALES'];
  const errs=[],warns=[];
  if(!raw.length){errs.push('File kosong.');return{errs,warns,rows:[],originalCount:0};}
  const s=normK(raw[0]);
  const miss=req.filter(k=>!(k in s));
  if(miss.length){errs.push(`Kolom wajib tidak ditemukan: ${miss.join(', ')}`);return{errs,warns,rows:[],originalCount:0};}
  // CATEGORY kolom — kalau tidak ada sama sekali, warning saja, jangan error
  if(!('CATEGORY' in s))warns.push('Kolom CATEGORY tidak ditemukan — category akan dikosongkan.');
  const map={};
  let skipped=0;
  raw.forEach((r,i)=>{
    const n=normK(r);
    const dept=String(n.DEPARTEMEN||'').trim().padStart(2,'0');
    const sku=String(n.SKU||'').trim();
    // Skip hanya jika SKU benar-benar kosong
    if(!sku){skipped++;return;}
    // Dept tidak dikenal = warning saja, BUKAN skip — data tetap masuk
    if(!DEPTS[dept])warns.push(`Row ${i+2}: Dept "${dept}" tidak dikenal — data tetap disimpan.`);
    const qty=parseFloat(String(n.QTY||'0').replace(/,/g,'.'))||0;
    const sales=parseFloat(String(n.SALES||'0').replace(/,/g,'.'))||0;
    const cat=String(n.CATEGORY||'').trim(); // boleh kosong
    const key=`${dept}__${sku}`;
    if(map[key]){
      map[key].qty+=qty;
      map[key].sales+=sales;
      // Kalau category berbeda, simpan keduanya
      if(cat&&map[key].category&&cat!==map[key].category)
        warns.push(`SKU ${sku}: category berbeda ("${map[key].category}" vs "${cat}") — menggunakan yang pertama.`);
    } else {
      map[key]={department_code:dept,sku,description:String(n.DESCRIPTION||'').trim(),qty,sales,category:cat};
    }
  });
  if(skipped>0)warns.push(`${skipped} baris dilewati karena SKU kosong.`);
  return{errs,warns,rows:Object.values(map),originalCount:raw.length};
}
function validateBudget(raw){
  const errs=[],warns=[];
  if(!raw.length){errs.push('File kosong.');return{errs,warns,rows:[]};}
  const s=normK(raw[0]);
  if(!('DEPARTEMEN' in s)||!('BUDGET' in s)){errs.push('Kolom DEPARTEMEN dan BUDGET diperlukan.');return{errs,warns,rows:[]};}
  const rows=[];
  raw.forEach((r,i)=>{const n=normK(r);const dept=String(n.DEPARTEMEN||'').trim().padStart(2,'0');const bud=parseFloat(n.BUDGET)||0;if(!DEPTS[dept])warns.push(`Row ${i+2}: Dept "${dept}" tidak dikenal.`);rows.push({department_code:dept,budget_amount:bud});});
  return{errs,warns,rows,originalCount:raw.length};
}
function validateDamage(raw){
  const errs=[],warns=[];
  if(!raw.length){errs.push('File kosong.');return{errs,warns,rows:[],originalCount:0};}
  const s=normK(raw[0]);
  const hasCost='TOTAL_COST' in s||'TOTAL COST' in s;
  const miss=['DEPARTEMEN','SKU','DESCRIPTION','QTY'].filter(k=>!(k in s));
  if(!hasCost)miss.push('TOTAL COST');
  if(miss.length){errs.push(`Kolom wajib tidak ditemukan: ${miss.join(', ')}`);return{errs,warns,rows:[],originalCount:0};}
  if(!('CATEGORY' in s))warns.push('Kolom CATEGORY tidak ditemukan — category akan dikosongkan.');
  const map={};
  let skipped=0;
  raw.forEach((r,i)=>{
    const n=normK(r);
    const dept=String(n.DEPARTEMEN||'').trim().padStart(2,'0');
    const sku=String(n.SKU||'').trim();
    if(!sku){skipped++;return;}
    if(!DEPTS[dept])warns.push(`Row ${i+2}: Dept "${dept}" tidak dikenal — data tetap disimpan.`);
    const qty=parseFloat(String(n.QTY||'0').replace(/,/g,'.'))||0;
    const cost=parseFloat(String(n.TOTAL_COST||n['TOTAL COST']||'0').replace(/,/g,'.'))||0;
    const cat=String(n.CATEGORY||'').trim();
    const key=`${dept}__${sku}`;
    if(map[key]){map[key].qty+=qty;map[key].total_cost+=cost;}
    else map[key]={department_code:dept,sku,description:String(n.DESCRIPTION||'').trim(),qty,total_cost:cost,category:cat};
  });
  if(skipped>0)warns.push(`${skipped} baris dilewati karena SKU kosong.`);
  return{errs,warns,rows:Object.values(map),originalCount:raw.length};
}

// ---- EXPORT — tampil sebagai modal in-app ----
// Platform artifact memblokir download, jadi data ditampilkan di modal
// User bisa screenshot atau share link artifact untuk akses data

let _exportModal = null;

function exportXLSX(rows, cols, filename){
  // Buat modal in-app
  const title = filename.replace('.xlsx','').replace(/_/g,' ');

  // Build raw data values (unformatted numbers for copy, for accurate paste to Excel)
  const getRaw = (c, r) => {
    const v = typeof c.g==='function' ? c.g(r) : r[c.k];
    return v==null ? '' : String(v);
  };

  const thHtml = cols.map(c=>`<th style="background:var(--bg3);color:var(--tm);padding:7px 10px;text-align:left;white-space:nowrap;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--bd)">${c.l}</th>`).join('');
  const tbHtml = rows.map((r,ri)=>`<tr style="background:${ri%2===0?'var(--bgc)':'var(--bg3)'};">${
    cols.map(c=>{
      const v=typeof c.g==='function'?c.g(r):r[c.k];
      const isNum=c.num&&!isNaN(Number(v))&&v!==''&&v!==null;
      const disp=isNum?Number(v).toLocaleString('id'):String(v??'');
      return`<td style="padding:7px 10px;font-size:11px;white-space:nowrap;border-bottom:1px solid var(--bd2);${isNum?'text-align:right;font-family:monospace':'color:var(--t1)'}">${disp}</td>`;
    }).join('')
  }</tr>`).join('');

  // Build tab-separated text for clipboard (header + rows, raw values)
  const tsvHeader = cols.map(c=>c.l).join('\t');
  const tsvRows = rows.map(r=>cols.map(c=>getRaw(c,r)).join('\t')).join('\n');
  const tsvData = tsvHeader + '\n' + tsvRows;

  // Buat atau update modal
  let modal = document.getElementById('exportModal');
  if(!modal){
    modal = document.createElement('div');
    modal.id = 'exportModal';
    modal.style.cssText = 'position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.7);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto';
    document.body.appendChild(modal);
  }
  modal.innerHTML = `
    <div style="background:var(--bg2);border:1px solid var(--bd);border-radius:6px;width:100%;max-width:900px;margin:auto">
      <div style="padding:14px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg2);z-index:1">
        <div style="min-width:0">
          <div style="font-size:13px;font-weight:600;color:var(--t1)">${title}</div>
          <div style="font-size:11px;color:var(--tm);margin-top:2px">${rows.length.toLocaleString('id')} baris — ${new Date().toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'})}</div>
        </div>
        <div style="display:flex;gap:8px;flex-shrink:0">
          <button id="exportCopyBtn" style="background:var(--green);color:#fff;border:none;padding:7px 13px;border-radius:4px;cursor:pointer;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px">
            📋 Copy ke Excel
          </button>
          <button onclick="document.getElementById('exportModal').remove()" style="background:var(--bg3);border:1px solid var(--bd);color:var(--t2);padding:6px 12px;border-radius:4px;cursor:pointer;font-size:12px">✕ Tutup</button>
        </div>
      </div>
      <div style="padding:12px 16px;background:rgba(59,130,246,.08);border-bottom:1px solid rgba(59,130,246,.2);font-size:12px;color:#93c5fd">
        💡 <strong>Cara cepat:</strong> Klik <b>📋 Copy ke Excel</b> → Buka Google Sheets / Excel → Paste (Ctrl+V). Semua kolom langsung rapi terpisah.
      </div>
      <div id="exportCopyFeedback" style="display:none;padding:8px 16px;background:rgba(5,150,105,.12);border-bottom:1px solid rgba(5,150,105,.3);font-size:12px;color:var(--green);font-weight:600">
        ✅ Berhasil disalin! ${rows.length.toLocaleString('id')} baris siap paste ke Excel/Google Sheets.
      </div>
      <div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
        <table style="width:100%;border-collapse:collapse;min-width:500px">
          <thead><tr>${thHtml}</tr></thead>
          <tbody>${tbHtml}</tbody>
        </table>
      </div>
      <div style="padding:12px 16px;border-top:1px solid var(--bd);font-size:11px;color:var(--tm);text-align:center">
        Total ${rows.length.toLocaleString('id')} baris data
      </div>
    </div>`;
  modal.onclick = e => { if(e.target===modal) modal.remove(); };

  // Wire up copy button
  const copyBtn = document.getElementById('exportCopyBtn');
  if(copyBtn){
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(tsvData).then(()=>{
        const fb = document.getElementById('exportCopyFeedback');
        if(fb){ fb.style.display='block'; setTimeout(()=>{ fb.style.display='none'; }, 3500); }
        copyBtn.textContent = '✅ Tersalin!';
        setTimeout(()=>{ copyBtn.innerHTML = '📋 Copy ke Excel'; }, 2500);
      }).catch(()=>{
        // Fallback for older browsers / mobile
        const ta = document.createElement('textarea');
        ta.value = tsvData;
        ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        try{ document.execCommand('copy');
          const fb = document.getElementById('exportCopyFeedback');
          if(fb){ fb.style.display='block'; setTimeout(()=>{ fb.style.display='none'; }, 3500); }
          copyBtn.textContent = '✅ Tersalin!';
          setTimeout(()=>{ copyBtn.innerHTML = '📋 Copy ke Excel'; }, 2500);
        }catch(e){ alert('Salin manual: tekan Ctrl+A pada tabel lalu Ctrl+C'); }
        document.body.removeChild(ta);
      });
    };
  }
}

      if(!email||!pass){S.loginErr='Email dan password wajib diisi.';re();return;}
      S.loginLoading=true;S.loginErr='';re();
      try{
        const data=await supa.signIn(email,pass);
        if(!data?.access_token)throw new Error('Login gagal');
        DB.s('sb_token',data.access_token);
        DB.s('sb_uid',data.user?.id);

        try{
          const profiles=await supa.select('profiles',{'id':'eq.'+data.user.id,'select':'*'},data.access_token);
          profile=profiles?.[0];
        }catch{}
        const safe={id:data.user.id,email:data.user.email,name:profile?.name||data.user.email,role:profile?.role||'viewer'};

  });
  document.querySelectorAll('[data-pg-sales]').forEach(el=>el.onclick=()=>{S.sales.pg+=parseInt(el.dataset.pgSales);re();});
  const es=document.getElementById('exportSales');if(es)es.onclick=()=>{
    const y=S.sales.year,m=S.sales.month;
    const sales=Store.getSales(y,m),salesLY=Store.getSales(y-1,m);
    const damage=Store.getDamage(y,m);
    const tyMap=sales.reduce((a,b)=>{a[`${b.department_code}__${b.sku}`]=b;return a;},{});
    const lyMap=salesLY.reduce((a,b)=>{a[`${b.department_code}__${b.sku}`]=b;return a;},{});
    // Build damage map: key -> total_cost
    const dmgMap=damage.reduce((a,b)=>{const k=`${b.department_code}__${b.sku}`;a[k]=(a[k]||0)+Number(b.total_cost||0);return a;},{});
    const allKeys=new Set([...Object.keys(tyMap),...Object.keys(lyMap)]);
    const allRows=[...allKeys].map(key=>{
      const ty=tyMap[key],ly=lyMap[key],base=ty||ly;
      const tySales=ty?Number(ty.sales||0):0;
      const dmgCost=dmgMap[key]||0;
      const dmgPct=tySales>0&&dmgCost>0?((dmgCost/tySales)*100).toFixed(2):'';
      return{department_code:base.department_code,sku:base.sku,description:base.description,

        growth_pct:ty&&ly?((Number(ty.sales||0)-Number(ly.sales||0))/(Number(ly.sales||0)||1)*100).toFixed(1):'',
        damage_cost:dmgCost,damage_pct:dmgPct,
        status:!ty?'Hilang':!ly?'Baru':'Ada di TY & LY'
      };
    }).filter(r=>S.sales.dept==='all'||r.department_code===S.sales.dept);
    const rows=S.sales.view==='missing'?allRows.filter(r=>r.status==='Hilang'):allRows.filter(r=>r.status!=='Hilang');
    exportXLSX(rows,[
      {l:'SKU',k:'sku'},{l:'Description',k:'description'},
      {l:'Dept Code',k:'department_code'},{l:'Department',g:r=>DEPTS[r.department_code]||r.department_code},
      {l:'Category',k:'category'},
      {l:'TY Sales',k:'sales',num:true},{l:'TY Qty',k:'qty',num:true},
      {l:'LY Sales',k:'ly_sales',num:true},{l:'LY Qty',k:'ly_qty',num:true},
      {l:'Growth %',k:'growth_pct'},
      {l:'Damage Cost',k:'damage_cost',num:true},{l:'% Dmg',k:'damage_pct'},
      {l:'Status',k:'status'}
    ], S.sales.view==='missing'
      ? `SKU_Hilang_${MONTHS[m-1]}_${y}.xlsx`
      : `Sales_Analysis_${MONTHS[m-1]}_${y}.xlsx`
    );
  };

  // Negative
  const nd=document.querySelector('[data-neg-dept]');if(nd)nd.onchange=()=>{S.neg.dept=nd.value;S.neg.pg=1;re();};
  document.querySelectorAll('[data-sort-neg]').forEach(el=>el.onclick=()=>{const col=el.dataset.sortNeg;if(S.neg.sort===col)S.neg.dir*=-1;else{S.neg.sort=col;S.neg.dir=1;}S.neg.pg=1;re();});
  document.querySelectorAll('[data-pg-neg]').forEach(el=>el.onclick=()=>{S.neg.pg+=parseInt(el.dataset.pgNeg);re();});
  const en=document.getElementById('exportNeg');if(en)en.onclick=()=>{
    const y=S.neg.year,m=S.neg.month;
    const sales=Store.getSales(y,m),salesLY=Store.getSales(y-1,m);
    const lyMap=salesLY.reduce((a,b)=>{a[`${b.department_code}__${b.sku}`]=b;return a;},{});
    const rows=sales.map(r=>{
      const l=lyMap[`${r.department_code}__${r.sku}`];
      if(!l||Number(r.sales)>=Number(l.sales))return null;
      const gap=Number(r.sales)-Number(l.sales);
      const pct=Number(l.sales)?((gap/Number(l.sales))*100).toFixed(1):'';
      return{...r,ly_sales:Number(l.sales),sales_gap:gap,growth_pct:pct};
    }).filter(Boolean).filter(r=>S.neg.dept==='all'||r.department_code===S.neg.dept);
    exportXLSX(rows,[
      {l:'SKU',k:'sku'},{l:'Description',k:'description'},
      {l:'Dept Code',k:'department_code'},{l:'Department',g:r=>DEPTS[r.department_code]||r.department_code},
      {l:'Category',k:'category'},
      {l:'TY Sales',k:'sales',num:true},{l:'LY Sales',k:'ly_sales',num:true},
      {l:'Sales Gap',k:'sales_gap',num:true},{l:'Growth %',k:'growth_pct'}
    ], `SKU_Minus_Growth_${MONTHS[m-1]}_${y}.xlsx`);

async function handleFile(f){
  S.upload.step=2;re();
  try{
    const raw=await parseXlsx(f);
    let v;
    if(S.upload.tab==='sales')v=validateSales(raw);
    else if(S.upload.tab==='budget')v=validateBudget(raw);
    else v=validateDamage(raw);
    S.upload.prev={...v,errors:v.errs,warnings:v.warns||[],filename:f.name};
    S.upload.step=3;
  }catch(err){
    S.upload.prev={errors:[err.message],warnings:[],rows:[],filename:f.name,originalCount:0};
    S.upload.step=3;
  }
  re();
}
